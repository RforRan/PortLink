services:

  # ── PHP-FPM (Laravel) ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortlink_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ../:/var/www                  # mount root project Laravel
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - shortlink_net
    depends_on:
      db:
        condition: service_healthy

  # ── Nginx ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: shortlink_nginx
    restart: unless-stopped
    ports:
      - "8080:80"                     # akses via http://localhost:8080
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ../:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - shortlink_net
    depends_on:
      - app

  # ── MySQL ─────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: shortlink_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      main
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Jakarta
    ports:
      - "3307:3306"                   # 3307 agar tidak bentrok dengan MySQL lokal
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - shortlink_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  shortlink_net:
    driver: bridge

volumes:
  db_data:
    driver: local
